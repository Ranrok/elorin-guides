<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Game</title>
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:22px;background:var(--bg-page);background-image:var(--grad-page)}.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}.col{display:flex;flex-direction:column;gap:14px}.cap{font-family:var(--font-mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px}</style>
</head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const DS = window.ElorinRSPSDesignSystem_44a46d;
const { GearGrid, InventoryGrid, ItemChip } = DS;
const gear=[{name:"Torva full helm"},{name:"Amulet of fury"},{name:"Zaryte bow"},{name:"Torva platebody"},{name:"Elysian spirit shield"},null,{name:"Torva platelegs"},{name:"Barrows gloves"},{name:"Primordial boots"},{name:"Ring of life"},null,{name:"Ava device"}];
const inv=[{name:"Saradomin brew",qty:6},{name:"Super restore",qty:4},{name:"Ranging potion",qty:2},{name:"Shark",qty:3},{name:"Zaryte bow"},{name:"Rune pouch"}];
function Card(){return (<div className="col" style={{gap:22}}>
<div className="el-preset"><GearGrid label="Gear" slots={gear} /><InventoryGrid label="Inventory" items={inv} /></div>
<div><div className="cap">Item chips, inline</div><p style={{maxWidth:420,fontSize:15}}>Bring <ItemChip name="Saradomin brew" qty={6} /> and a <ItemChip name="Ring of life" rarity="rare" href="#" />. Skip the <ItemChip name="Elysian spirit shield" rarity="mega-rare" /> unless you own one.</p></div>
</div>);}
ReactDOM.createRoot(document.getElementById("root")).render(<Card />);
</script></body></html>
