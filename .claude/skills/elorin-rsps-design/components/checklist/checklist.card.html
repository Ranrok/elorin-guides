<!-- @dsCard group="Components" viewport="700x400" name="Checklist" subtitle="Sticky progress header, section card, tickable items" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Checklist</title>
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:22px;background:var(--bg-page);background-image:var(--grad-page)}.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}.col{display:flex;flex-direction:column;gap:14px}.cap{font-family:var(--font-mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px}body{padding:0}.pad{padding:22px}</style>
</head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const DS = window.ElorinRSPSDesignSystem_44a46d;
const { ProgressHeader, SectionCard, ChecklistItem, ProgressBar, Badge, Button } = DS;
function Card(){const [done,setDone]=React.useState({tut:true,acc:true});
const toggle=(next,id)=>setDone(d=>({...d,[id]:next}));
const items=[{id:"tut",title:"Finish the tutorial",description:"Skip it if you have played before. You keep the starter kit either way."},
{id:"acc",title:"Set a bank PIN",description:"Do it before your first trip out."},
{id:"vote",title:"Vote for the first time",subSteps:["Claim vote points at the Vote shop","Buy a Vote mystery box"],meta:<Badge tone="easy" bar>Easy</Badge>},
{id:"gear",title:"Buy your first full rune set",meta:<Badge tone="skill" level={40}>Defence</Badge>}];
const count=items.filter(i=>done[i.id]).length;
return (<div><ProgressHeader title="Starting out" value={count+8} total={40}><Button variant="ghost" size="sm">Reset</Button></ProgressHeader>
<div className="pad"><SectionCard label="Step 01" title="First hour" description="Get off Tutorial Island and into the game proper." value={count} total={items.length}>
{items.map(i=><ChecklistItem key={i.id} {...i} checked={!!done[i.id]} onChange={toggle} />)}
</SectionCard>
<div style={{marginTop:22,maxWidth:340}}><ProgressBar value={12} total={40} /></div>
</div></div>);}
ReactDOM.createRoot(document.getElementById("root")).render(<Card />);
</script></body></html>
