<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Elorin RSPS</title>
<link rel="stylesheet" href="styles.css">
<style>body{margin:0;width:1280px;height:854px;overflow:hidden;display:grid;grid-template-columns:1fr 300px}.mark{background-color:#0A101E;background-image:radial-gradient(760px 500px at 50% 34%,#1b2947 0%,rgba(10,16,30,0) 70%);display:grid;place-items:center}.mark img{width:74%;filter:drop-shadow(0 0 70px rgba(74,127,193,.45))}.strip{display:grid;grid-template-rows:repeat(4,1fr)}.strip i{display:block}</style>
</head><body>
<div class="mark"><img src="assets/elorin-logo.png" alt="Elorin"></div>
<div class="strip"><i style="background:#fff5d4"></i><i style="background:#e8c885"></i><i style="background:#c8a45a"></i><i style="background:#4A7FC1"></i></div>
</body></html>
