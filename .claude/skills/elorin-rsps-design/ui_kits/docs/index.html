<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elorin Guides - UI kit</title>
<link rel="icon" href="../../assets/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../../styles.css">
<style>body{min-height:100vh}#root{position:relative;z-index:1}@media (max-width:900px){.el-page[style*="sidebar-w"]{grid-template-columns:minmax(0,1fr) !important}}</style>
</head><body>
<div class="el-ridge"></div>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="ChecklistScreen.jsx"></script>
<script type="text/babel" src="BossGuideScreen.jsx"></script>
<script type="text/babel" src="GuidesHubScreen.jsx"></script>
<script type="text/babel">
const { SiteHeader, SiteFooter, Button } = window.ElorinRSPSDesignSystem_44a46d;
const NAV = [
  { label: 'Home', href: '#' },
  { label: 'Guides', href: '#' },
  { label: 'Discord', href: '#' },
  { label: 'Vote', href: '#' },
  { label: 'Download', href: '#' },
];
const KEY = 'elorin.startingOut.uikit';

function App() {
  const [view, setView] = React.useState('hub');
  const [done, setDone] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
  });
  React.useEffect(() => {
    try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {}
  }, [done]);
  const toggle = (next, id) => setDone((d) => ({ ...d, [id]: next }));
  return (
    <>
      <SiteHeader
        items={NAV}
        active={view === 'hub' ? 'Guides' : 'Guides'}
        logoSrc="../../assets/elorin-logo.png"
        actions={<>
          <Button variant="outline" size="sm" flourishes={false} onClick={() => setView('hub')}>Guides</Button>
          <Button variant="outline" size="sm" flourishes={false}>Account</Button>
        </>}
      />
      {view === 'hub' ? (
        <GuidesHubScreen onOpenChecklist={() => setView('checklist')} onOpenBoss={() => setView('boss')} />
      ) : view === 'checklist' ? (
        <ChecklistScreen done={done} onToggle={toggle} onReset={() => setDone({})} />
      ) : (
        <BossGuideScreen onNavigate={() => setView('checklist')} />
      )}
      <SiteFooter
        items={[{ label: 'Guides', href: '#' }, { label: 'Discord', href: '#' }, { label: 'Vote', href: '#' }, { label: 'Rules', href: '#' }]}
        logoSrc="../../assets/elorin-logo.png"
      />
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
