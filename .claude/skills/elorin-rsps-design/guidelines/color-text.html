<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg-page);background-image:var(--grad-page)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{width:98px}.sw i{display:block;height:52px;border:1px solid var(--border-subtle);border-radius:var(--radius-card);box-shadow:var(--bevel)}.sw b{display:block;margin-top:7px;font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-secondary)}.sw s{display:block;text-decoration:none;font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}.cap{font-family:var(--font-mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-muted)}p{margin:0 0 8px}</style>
</head><body>
<p style="color:var(--text-primary);font-size:17px">Primary #E8EDF5: body copy and headings. 14.6:1 on the card surface, 16.2:1 on the page.</p><p style="color:var(--text-secondary);font-size:17px">Secondary #A4B3C9: descriptions, table cells, callout bodies. 8.1:1 on the card surface.</p><p style="color:var(--text-muted);font-size:12px;font-family:var(--font-mono);letter-spacing:.15em;text-transform:uppercase">Muted #7D8CA6: [ labels and metadata only, 5.1:1, never a sentence ]</p><p style="color:var(--text-link);font-size:17px">Link #7FB2E5: <a href="#">in-line link, gold on hover</a></p>
</body></html>
