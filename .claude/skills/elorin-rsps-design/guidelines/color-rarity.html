<!-- @dsCard group="Colors" viewport="700x180" name="Rarity and difficulty" subtitle="Drop-table rates and content grading - never the only signal" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg-page);background-image:var(--grad-page)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{width:98px}.sw i{display:block;height:52px;border:1px solid var(--border-subtle);border-radius:var(--radius-card);box-shadow:var(--bevel)}.sw b{display:block;margin-top:7px;font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-secondary)}.sw s{display:block;text-decoration:none;font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}.cap{font-family:var(--font-mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-muted)}.r{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}</style>
</head><body>
<div class="cap" style="margin-bottom:8px">Rarity</div><div class="r"><span class="el-tag el-tag--common"><span class="el-tag__dot"></span>Common</span><span class="el-tag el-tag--uncommon"><span class="el-tag__dot"></span>Uncommon</span><span class="el-tag el-tag--rare"><span class="el-tag__dot"></span>Rare</span><span class="el-tag el-tag--very-rare"><span class="el-tag__dot"></span>Very rare</span><span class="el-tag el-tag--mega-rare"><span class="el-tag__dot"></span>Mega rare</span></div><div class="cap" style="margin-bottom:8px">Difficulty</div><div class="r"><span class="el-badge el-badge--easy"><span class="el-badge__bar"></span>Easy</span><span class="el-badge el-badge--medium"><span class="el-badge__bar"></span>Medium</span><span class="el-badge el-badge--hard"><span class="el-badge__bar"></span>Hard</span><span class="el-badge el-badge--elite"><span class="el-badge__bar"></span>Elite</span></div>
</body></html>
