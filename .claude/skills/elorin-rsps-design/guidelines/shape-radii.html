<!-- @dsCard group="Spacing" viewport="700x170" name="Radii and borders" subtitle="2 chip / 4 card / 6 button - pills for tags only" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg-page);background-image:var(--grad-page)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{width:98px}.sw i{display:block;height:52px;border:1px solid var(--border-subtle);border-radius:var(--radius-card);box-shadow:var(--bevel)}.sw b{display:block;margin-top:7px;font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-secondary)}.sw s{display:block;text-decoration:none;font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}.cap{font-family:var(--font-mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-muted)}.q{display:flex;gap:14px}.q div{width:120px;height:66px;border:1px solid var(--border-strong);background-color:var(--surface-card);background-image:var(--grad-card);box-shadow:var(--bevel);display:grid;place-items:center;font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--text-secondary)}</style>
</head><body>
<div class="q"><div style="border-radius:2px">2 chip</div><div style="border-radius:4px">4 card</div><div style="border-radius:6px">6 button</div><div style="border-radius:999px">pill: tags</div></div>
</body></html>
