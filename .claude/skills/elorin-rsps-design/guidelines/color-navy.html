<!-- @dsCard group="Colors" viewport="700x130" name="Navy space" subtitle="Page, surfaces and borders - the whole dark ladder" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg-page);background-image:var(--grad-page)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{width:98px}.sw i{display:block;height:52px;border:1px solid var(--border-subtle);border-radius:var(--radius-card);box-shadow:var(--bevel)}.sw b{display:block;margin-top:7px;font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-secondary)}.sw s{display:block;text-decoration:none;font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}.cap{font-family:var(--font-mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-muted)}</style>
</head><body>
<div class="g"><div class="sw"><i style="background:#0A101E"></i><b>bg page</b><s>--navy-900</s></div><div class="sw"><i style="background:#111B2E"></i><b>surface card</b><s>--navy-800</s></div><div class="sw"><i style="background:#16223A"></i><b>surface raised</b><s>--navy-700</s></div><div class="sw"><i style="background:#1E2C47"></i><b>border subtle</b><s>--navy-600</s></div><div class="sw"><i style="background:#2C3E60"></i><b>border strong</b><s>--navy-500</s></div><div class="sw"><i style="background:#070C16"></i><b>sunken</b><s>--surface-sunken</s></div></div>
</body></html>
