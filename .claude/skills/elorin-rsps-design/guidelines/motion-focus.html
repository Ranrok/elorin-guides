<!-- @dsCard group="Brand" viewport="700x190" name="Motion and focus" subtitle="150ms ease-out, gold focus ring at 2px / 2px offset" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg-page);background-image:var(--grad-page)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{width:98px}.sw i{display:block;height:52px;border:1px solid var(--border-subtle);border-radius:var(--radius-card);box-shadow:var(--bevel)}.sw b{display:block;margin-top:7px;font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-secondary)}.sw s{display:block;text-decoration:none;font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}.cap{font-family:var(--font-mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-muted)}.m{display:flex;gap:16px;align-items:center}.pill{padding:10px 16px;border:1px solid var(--border-subtle);border-radius:var(--radius-button);background:var(--surface-card);font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-secondary);transition:var(--transition-colors)}.pill:hover{border-color:var(--border-gold);color:var(--gold-200)}.ring{outline:2px solid var(--gold-200);outline-offset:2px}</style>
</head><body>
<div class="m"><span class="pill">hover me - border + gold step</span><span class="pill ring">focus-visible ring</span></div><p class="cap" style="margin-top:16px">150ms ease-out &middot; no bounce, no scale &middot; prefers-reduced-motion drops all durations to 0</p>
</body></html>
