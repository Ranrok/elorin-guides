<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<style>body{margin:0;padding:20px;background:var(--bg-page);background-image:var(--grad-page)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{width:98px}.sw i{display:block;height:52px;border:1px solid var(--border-subtle);border-radius:var(--radius-card);box-shadow:var(--bevel)}.sw b{display:block;margin-top:7px;font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-secondary)}.sw s{display:block;text-decoration:none;font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}.cap{font-family:var(--font-mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-muted)}.s{display:flex;gap:14px}.s div{flex:1;padding:16px;font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-secondary);border-radius:var(--radius-card)}</style>

<div class="s"><div style="background:var(--surface-sunken);border:1px solid var(--border-subtle)">sunken<br>track, slot, well</div><div style="background-color:var(--surface-card);background-image:var(--grad-card);border:1px solid var(--border-subtle);box-shadow:var(--bevel),var(--shadow-card)">card<br>+ top light + bevel</div><div style="background-color:var(--surface-raised);background-image:var(--grad-raised);border:1px solid var(--border-strong);box-shadow:var(--bevel-strong),var(--shadow-raised)">raised<br>input, tooltip</div><div style="background-color:var(--surface-card);border:1px solid var(--border-gold-soft);box-shadow:var(--bevel),var(--glow-gold)">gold glow<br>active, checked</div></div>
