<!-- @dsCard group="Spacing" viewport="700x170" name="Control heights and touch targets" subtitle="44px minimum, everywhere a finger lands" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg-page);background-image:var(--grad-page)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{width:98px}.sw i{display:block;height:52px;border:1px solid var(--border-subtle);border-radius:var(--radius-card);box-shadow:var(--bevel)}.sw b{display:block;margin-top:7px;font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-secondary)}.sw s{display:block;text-decoration:none;font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}.cap{font-family:var(--font-mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-muted)}.c{display:flex;align-items:flex-end;gap:14px}.c div{border:1px solid var(--border-gold-soft);border-radius:var(--radius-button);background:var(--surface-raised);display:grid;place-items:center;font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--text-gold);width:120px}</style>
</head><body>
<div class="c"><div style="height:36px">36: dense</div><div style="height:44px">44: default</div><div style="height:52px">52: large</div></div><p class="cap" style="margin-top:14px">36px is desktop-dense only and never the sole tap target</p>
</body></html>
