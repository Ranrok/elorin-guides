<!-- @dsCard group="Type" viewport="700x200" name="Metal text gradients" subtitle="Silver and gold - headings above 24px only" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg-page);background-image:var(--grad-page)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{width:98px}.sw i{display:block;height:52px;border:1px solid var(--border-subtle);border-radius:var(--radius-card);box-shadow:var(--bevel)}.sw b{display:block;margin-top:7px;font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-secondary)}.sw s{display:block;text-decoration:none;font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}.cap{font-family:var(--font-mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-muted)}.m{font-family:var(--font-display);font-size:40px;font-weight:700;letter-spacing:.04em;line-height:1.2}</style>
</head><body>
<div class="m el-metal-silver">Silver: page headings</div><div class="m el-metal-gold">Gold: hero emphasis</div><p class="cap" style="margin-top:12px">background-clip: text &middot; never below ~24px: the bottom stop fails contrast</p>
</body></html>
